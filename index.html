<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Batchmate — 가능시간 수집 & 자동배치</title>
  <style>
    :root{--bg:#f7f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#ff6b6b;--accent2:#fff0f0;--ok:#10b981;--warn:#ef4444;--soft:#f3f4f6}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
    button,input,select{font:inherit} button{cursor:pointer}.wrap{max-width:1180px;margin:0 auto;padding:28px 18px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:white;font-weight:800}.brand h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:14px;margin-top:3px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}.section-title{font-size:17px;font-weight:700;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}@media(max-width:720px){.grid,.grid3{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
    label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:white}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700}.btn.primary{background:var(--accent);color:white}.btn.secondary{background:var(--soft);color:var(--text)}.btn.ghost{background:white;border:1px solid var(--line)}.btn.danger{background:#fff1f2;color:#be123c}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.hint{font-size:13px;color:var(--muted)}.status{padding:10px 12px;border-radius:12px;font-size:14px;margin-top:10px}.status.ok{background:#ecfdf5;color:#047857}.status.err{background:#fef2f2;color:#b91c1c}.status.info{background:#eff6ff;color:#1d4ed8}
    .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:700}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .scroll{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}.sched{border-collapse:separate;border-spacing:0;min-width:720px;width:100%;table-layout:fixed}.sched th,.sched td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;vertical-align:top}.sched th:last-child,.sched td:last-child{border-right:0}.sched tr:last-child td{border-bottom:0}.sched th{background:#fafafa;padding:10px 8px;font-size:13px;position:sticky;top:0;z-index:2}.timecol{width:86px;background:#fafafa!important;padding:10px 6px!important;font-size:12px;font-weight:700;position:sticky;left:0;z-index:1}.slot{min-height:48px;padding:8px 6px;user-select:none;touch-action:none;transition:.08s;background:#fff}.slot.selectable:hover{background:#fafafa}.slot.selected{background:var(--accent2);box-shadow:inset 0 0 0 2px var(--accent)}
    .assigned{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:999px;background:#111827;color:#fff;font-size:12px;font-weight:700}.pill.click{cursor:pointer}.candidates{margin-top:6px;color:var(--muted);font-size:11px;line-height:1.5}.cand{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}.need{font-size:11px;color:var(--warn);font-weight:800;margin-top:4px}.req{font-size:10px;color:var(--muted);margin-top:3px}.mini{font-size:12px;color:var(--muted)}
    .copybox{display:flex;gap:8px}.copybox input{flex:1}.people{display:flex;flex-wrap:wrap;gap:8px}.person{background:#f9fafb;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:13px}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat>div{background:#fafafa;border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{font-size:20px;display:block;margin-top:3px}@media(max-width:600px){.stat{grid-template-columns:1fr}}
    .hidden{display:none!important}.footer{margin-top:24px;color:var(--muted);font-size:12px;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand"><div class="logo">B</div><div><h1>Batchmate</h1><div class="sub">가능시간 수집 → 자동배치 → 최종표 다운로드</div></div></div>
      <button class="btn ghost" id="homeBtn">새 시간표 만들기</button>
    </div>

    <div id="app"></div>
    <div class="footer">이 사이트는 이름과 가능시간만 저장합니다. 관리자 링크는 다른 사람에게 공유하지 마세요.</div>
  </div>

<script>
const SUPABASE_URL = 'https://fweopvnzjyowcpimspcc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CeMIJaXC5hb2Yz1IArNQXQ_nDe4qiRw';
const app = document.getElementById('app');
const homeBtn = document.getElementById('homeBtn');
homeBtn.addEventListener('click',()=>location.href=location.pathname);

async function rpc(name, payload={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`},
    body:JSON.stringify(payload)
  });
  const text = await res.text();
  if(!res.ok){ let msg=text; try{msg=JSON.parse(text).message||text}catch{}; throw new Error(msg); }
  return text ? JSON.parse(text) : null;
}
function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function token(){const a=new Uint8Array(24);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}
function ymd(d){return d.toISOString().slice(0,10)}
function addDays(str,n){const d=new Date(str+'T00:00:00');d.setDate(d.getDate()+n);return d}
function koDate(str,n){return new Intl.DateTimeFormat('ko-KR',{month:'numeric',day:'numeric',weekday:'short'}).format(addDays(str,n))}
function timeToMin(t){const [h,m]=t.split(':').map(Number);return h*60+m}
function minToTime(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function getSlots(s){const out=[];for(let m=timeToMin(s.start_time);m<timeToMin(s.end_time);m+=s.interval_minutes) out.push(m);return out}
function slotKey(d,i){return `${d}:${i}`}
function setStatus(id,msg,type='info'){const el=document.getElementById(id); if(!el)return; el.className=`status ${type}`;el.textContent=msg;el.classList.remove('hidden')}

function renderHome(){
  const today=ymd(new Date());
  app.innerHTML=`
  <div class="card"><h2 class="section-title">새 시간표 만들기</h2>
    <div class="grid">
      <div><label>시간표 이름</label><input id="title" class="field" value="SCAN 배치표" maxlength="120"></div>
      <div><label>시작 날짜</label><input id="startDate" class="field" type="date" value="${today}"></div>
      <div><label>며칠 동안?</label><input id="dayCount" class="field" type="number" min="1" max="14" value="5"></div>
      <div><label>기본 필요 인원</label><input id="required" class="field" type="number" min="0" max="20" value="2"></div>
      <div><label>시작 시간</label><input id="startTime" class="field" type="time" value="10:00"></div>
      <div><label>종료 시간</label><input id="endTime" class="field" type="time" value="18:00"></div>
      <div><label>시간 단위</label><select id="interval" class="field"><option value="60">1시간</option><option value="30">30분</option></select></div>
      <div><label>1인 최대 배치시간</label><select id="maxHours" class="field"><option value="4" selected>4시간</option><option value="2">2시간</option><option value="3">3시간</option><option value="5">5시간</option><option value="6">6시간</option><option value="8">8시간</option><option value="0">제한 없음</option></select></div>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="createBtn">시간표 만들기</button><span class="hint">생성 후 참여자용 링크와 관리자용 링크가 따로 만들어집니다.</span></div>
    <div id="createStatus" class="status hidden"></div>
  </div>`;
  document.getElementById('createBtn').addEventListener('click',createSchedule);
}
async function createSchedule(){
  try{
    const p={
      p_title:document.getElementById('title').value.trim(),
      p_start_date:document.getElementById('startDate').value,
      p_day_count:+document.getElementById('dayCount').value,
      p_start_time:document.getElementById('startTime').value,
      p_end_time:document.getElementById('endTime').value,
      p_interval_minutes:+document.getElementById('interval').value,
      p_default_required:+document.getElementById('required').value,
      p_max_hours:+document.getElementById('maxHours').value,
      p_admin_token:token()
    };
    if(!p.p_title||!p.p_start_date) throw new Error('시간표 이름과 날짜를 입력해주세요.');
    const r=await rpc('create_schedule',p);
    location.href=`${location.pathname}?admin=${encodeURIComponent(r.slug)}&token=${encodeURIComponent(p.p_admin_token)}`;
  }catch(e){setStatus('createStatus',e.message,'err')}
}

function buildAvailabilityGrid(s, selected, interactive=true){
  const slots=getSlots(s);
  let h='<div class="scroll"><table class="sched"><thead><tr><th class="timecol">시간</th>';
  for(let d=0;d<s.day_count;d++) h+=`<th>${esc(koDate(s.start_date,d))}</th>`;
  h+='</tr></thead><tbody>';
  slots.forEach((m,i)=>{h+=`<tr><td class="timecol">${minToTime(m)}<br><span class="mini">~${minToTime(Math.min(m+s.interval_minutes,timeToMin(s.end_time)))}</span></td>`;for(let d=0;d<s.day_count;d++){const k=slotKey(d,i);h+=`<td><div class="slot ${interactive?'selectable':''} ${selected.has(k)?'selected':''}" data-key="${k}"></div></td>`}h+='</tr>'});
  return h+'</tbody></table></div>';
}

async function renderParticipant(slug){
  app.innerHTML='<div class="card">불러오는 중...</div>';
  try{
    const data=await rpc('get_public_schedule',{p_slug:slug}); if(!data) throw new Error('시간표를 찾을 수 없습니다.');
    const s=data.schedule; const selected=new Set();
    app.innerHTML=`<div class="card"><h2 class="section-title">${esc(s.title)}</h2><div class="hint">${esc(koDate(s.start_date,0))}부터 ${s.day_count}일 · ${s.start_time}~${s.end_time} · ${s.interval_minutes}분 단위</div></div>
    <div class="card"><div class="grid"><div><label>이름</label><input id="pname" class="field" placeholder="예: 김민진"></div><div style="display:flex;align-items:end"><button id="loadMine" class="btn secondary" style="width:100%">이전 응답 불러오기</button></div></div><div class="hint" style="margin-top:8px">마우스나 손가락으로 칸을 드래그해서 가능한 시간을 선택하세요.</div></div>
    <div class="card"><h2 class="section-title">가능한 시간 선택</h2><div id="availGrid">${buildAvailabilityGrid(s,selected,true)}</div><div class="row" style="margin-top:14px"><button id="submitAvail" class="btn primary">가능시간 제출</button><button id="clearAvail" class="btn secondary">전체 해제</button><span id="countTxt" class="hint">0칸 선택</span></div><div id="pStatus" class="status hidden"></div></div>`;
    attachDrag(selected,()=>{document.getElementById('countTxt').textContent=`${selected.size}칸 선택`});
    document.getElementById('clearAvail').addEventListener('click',()=>{selected.clear();document.querySelectorAll('.slot').forEach(x=>x.classList.remove('selected'));document.getElementById('countTxt').textContent='0칸 선택'});
    document.getElementById('loadMine').addEventListener('click',async()=>{
      const name=document.getElementById('pname').value.trim(); if(!name) return setStatus('pStatus','이름을 먼저 입력해주세요.','err');
      const key=`batchmate:${slug}:${name}`; const et=localStorage.getItem(key); if(!et) return setStatus('pStatus','이 기기에는 이전 제출 기록이 없습니다.','info');
      try{const r=await rpc('get_my_availability',{p_slug:slug,p_name:name,p_edit_token:et}); if(!r) throw new Error('이전 응답을 찾을 수 없습니다.'); selected.clear();r.slots.forEach(x=>selected.add(x));document.querySelectorAll('.slot').forEach(x=>x.classList.toggle('selected',selected.has(x.dataset.key)));document.getElementById('countTxt').textContent=`${selected.size}칸 선택`;setStatus('pStatus','이전 응답을 불러왔습니다. 수정 후 다시 제출할 수 있어요.','ok')}catch(e){setStatus('pStatus',e.message,'err')}
    });
    document.getElementById('submitAvail').addEventListener('click',async()=>{
      const name=document.getElementById('pname').value.trim(); if(!name)return setStatus('pStatus','이름을 입력해주세요.','err');
      const key=`batchmate:${slug}:${name}`; let et=localStorage.getItem(key); if(!et){et=token();localStorage.setItem(key,et)}
      try{await rpc('submit_availability',{p_slug:slug,p_name:name,p_edit_token:et,p_slots:[...selected]});setStatus('pStatus','제출 완료! 이제 이 창을 닫아도 됩니다.','ok')}catch(e){setStatus('pStatus',e.message,'err')}
    });
  }catch(e){app.innerHTML=`<div class="card"><div class="status err">${esc(e.message)}</div></div>`}
}
function attachDrag(selected,onChange){let down=false;let mode=true;document.querySelectorAll('.slot.selectable').forEach(el=>{
  el.addEventListener('pointerdown',e=>{down=true;el.setPointerCapture?.(e.pointerId);mode=!selected.has(el.dataset.key);apply(el)});
  el.addEventListener('pointerenter',()=>{if(down)apply(el)});
  el.addEventListener('pointerup',()=>down=false);
  function apply(x){if(mode)selected.add(x.dataset.key);else selected.delete(x.dataset.key);x.classList.toggle('selected',mode);onChange()}
});window.addEventListener('pointerup',()=>down=false,{once:false})}

function scheduleResultTable(data, assignments){
  const s=data.schedule, slots=getSlots(s), avail=data.availability||{}, reqMap={};(data.requirements||[]).forEach(r=>reqMap[slotKey(r.day_index,r.slot_index)]=r.required);
  let h='<div class="scroll"><table class="sched"><thead><tr><th class="timecol">시간</th>';for(let d=0;d<s.day_count;d++)h+=`<th>${esc(koDate(s.start_date,d))}</th>`;h+='</tr></thead><tbody>';
  slots.forEach((m,i)=>{h+=`<tr><td class="timecol">${minToTime(m)}<br><span class="mini">~${minToTime(Math.min(m+s.interval_minutes,timeToMin(s.end_time)))}</span></td>`;for(let d=0;d<s.day_count;d++){const k=slotKey(d,i),as=assignments[k]||[],required=reqMap[k]??s.default_required;const candidates=Object.keys(avail).filter(n=>(avail[n]||[]).includes(k)&&!as.includes(n));h+=`<td><div class="slot" data-result-key="${k}"><div class="assigned">${as.map(n=>`<span class="pill click assignedName" data-key="${k}" data-name="${esc(n)}" title="클릭하면 배치에서 제외">${esc(n)} ×</span>`).join('')}</div>${as.length<required?`<div class="need">${required-as.length}명 부족</div>`:''}<div class="req">필요 ${required}명 · 배치 ${as.length}명</div>${candidates.length?`<div class="candidates">가능한 다른 사람<br>${candidates.map(n=>`<span class="cand candidateName" data-key="${k}" data-name="${esc(n)}">${esc(n)}</span>`).join(' · ')}</div>`:'<div class="candidates">다른 가능 인원 없음</div>'}</div></td>`}h+='</tr>'});
  return h+'</tbody></table></div>';
}
function autoAssign(data){
  const s=data.schedule, avail=data.availability||{}, people=Object.keys(avail), reqMap={};(data.requirements||[]).forEach(r=>reqMap[slotKey(r.day_index,r.slot_index)]=r.required);const slots=getSlots(s), a={}, counts={};people.forEach(p=>counts[p]=0);const maxSlots=s.max_hours===0?Infinity:Math.floor((s.max_hours*60)/s.interval_minutes);
  const keys=[];for(let d=0;d<s.day_count;d++)for(let i=0;i<slots.length;i++)keys.push(slotKey(d,i));
  keys.sort((x,y)=>people.filter(p=>(avail[p]||[]).includes(x)).length-people.filter(p=>(avail[p]||[]).includes(y)).length);
  keys.forEach(k=>{a[k]=[];const need=reqMap[k]??s.default_required;const cand=people.filter(p=>(avail[p]||[]).includes(k)&&counts[p]<maxSlots).sort((p,q)=>counts[p]-counts[q]||Math.random()-.5);for(let i=0;i<Math.min(need,cand.length);i++){a[k].push(cand[i]);counts[cand[i]]++}});return a;
}
function personHours(assignments,name,s){let c=0;Object.values(assignments).forEach(a=>{if(a.includes(name))c++});return c*s.interval_minutes/60}

async function renderAdmin(slug,adminToken){
  app.innerHTML='<div class="card">관리자 화면을 불러오는 중...</div>';
  try{
    let data=await rpc('get_admin_schedule',{p_slug:slug,p_admin_token:adminToken});let assignments=data.assignments||{};const s=data.schedule;
    const share=`${location.origin}${location.pathname}?s=${encodeURIComponent(slug)}`;
    app.innerHTML=`
      <div class="card"><h2 class="section-title">${esc(s.title)} <span class="mini">관리자</span></h2><div class="copybox"><input class="field" id="shareUrl" readonly value="${esc(share)}"><button class="btn primary" id="copyShare">참여 링크 복사</button></div><div class="hint" style="margin-top:8px">⚠️ 지금 주소창의 관리자 URL에는 비밀 토큰이 들어 있습니다. 참여자에게는 위 참여 링크만 보내세요.</div></div>
      <div class="stat"><div><span class="mini">응답 인원</span><b id="pCount">${data.participants.length}</b></div><div><span class="mini">시간 단위</span><b>${s.interval_minutes}분</b></div><div><span class="mini">1인 최대</span><b id="maxLabel">${s.max_hours===0?'제한 없음':s.max_hours+'시간'}</b></div></div>
      <div class="card" style="margin-top:16px"><div class="row"><div class="grow"><h2 class="section-title" style="margin-bottom:4px">자동배치 조건</h2><div class="hint">각 사람의 가능시간 안에서 최대시간을 넘지 않도록 균등하게 배치합니다.</div></div><select id="adminMax" class="field" style="max-width:180px"><option value="2">2시간</option><option value="3">3시간</option><option value="4">4시간</option><option value="5">5시간</option><option value="6">6시간</option><option value="8">8시간</option><option value="0">제한 없음</option></select><button class="btn secondary" id="saveMax">조건 저장</button><button class="btn primary" id="autoBtn">자동배치</button><button class="btn ghost" id="refreshBtn">응답 새로고침</button></div><div id="aStatus" class="status hidden"></div></div>
      <div class="card"><h2 class="section-title">제출한 사람</h2><div id="peopleList" class="people">${data.participants.length?data.participants.map(p=>`<span class="person">${esc(p.name)}</span>`).join(''):'<span class="hint">아직 제출한 사람이 없습니다.</span>'}</div></div>
      <div class="card"><div class="row"><div class="grow"><h2 class="section-title" style="margin-bottom:4px">최종 배치표</h2><div class="hint">검은 이름 = 실제 배치 · 아래 작은 이름 = 그 시간에 가능한 다른 사람. 후보자를 클릭하면 추가, 배치자를 클릭하면 제외됩니다.</div></div><button class="btn ghost" id="csvBtn">CSV 다운로드</button><button class="btn primary" id="saveAssign">배치표 저장</button></div><div id="resultWrap" style="margin-top:14px">${scheduleResultTable(data,assignments)}</div></div>`;
    document.getElementById('adminMax').value=String(s.max_hours);
    document.getElementById('copyShare').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(share);setStatus('aStatus','참여 링크를 복사했습니다. 단톡방에 그대로 보내면 됩니다.','ok')}catch{document.getElementById('shareUrl').select();setStatus('aStatus','주소를 선택했습니다. Ctrl+C로 복사해주세요.','info')}});
    document.getElementById('saveMax').addEventListener('click',async()=>{try{const v=+document.getElementById('adminMax').value;await rpc('update_schedule_settings',{p_slug:slug,p_admin_token:adminToken,p_max_hours:v});data.schedule.max_hours=v;document.getElementById('maxLabel').textContent=v===0?'제한 없음':v+'시간';setStatus('aStatus','최대 배치시간 조건을 저장했습니다.','ok')}catch(e){setStatus('aStatus',e.message,'err')}});
    document.getElementById('autoBtn').addEventListener('click',()=>{data.schedule.max_hours=+document.getElementById('adminMax').value;assignments=autoAssign(data);renderResults();setStatus('aStatus','자동배치가 완료되었습니다. 결과를 확인한 뒤 저장하세요.','ok')});
    document.getElementById('refreshBtn').addEventListener('click',()=>location.reload());
    document.getElementById('saveAssign').addEventListener('click',async()=>{try{await rpc('save_assignments',{p_slug:slug,p_admin_token:adminToken,p_assignments:assignments});setStatus('aStatus','배치표를 저장했습니다.','ok')}catch(e){setStatus('aStatus',e.message,'err')}});
    document.getElementById('csvBtn').addEventListener('click',()=>downloadCsv(data,assignments));
    function renderResults(){document.getElementById('resultWrap').innerHTML=scheduleResultTable(data,assignments);attachResultEvents()}
    function attachResultEvents(){
      document.querySelectorAll('.assignedName').forEach(el=>el.addEventListener('click',()=>{const k=el.dataset.key,n=el.dataset.name;assignments[k]=(assignments[k]||[]).filter(x=>x!==n);renderResults()}));
      document.querySelectorAll('.candidateName').forEach(el=>el.addEventListener('click',()=>{const k=el.dataset.key,n=el.dataset.name,max=+document.getElementById('adminMax').value,h=personHours(assignments,n,data.schedule);if(max!==0&&h+data.schedule.interval_minutes/60>max){setStatus('aStatus',`${n}님은 1인 최대 배치시간(${max}시간)을 초과해서 추가할 수 없습니다.`,'err');return}assignments[k]=assignments[k]||[];if(!assignments[k].includes(n))assignments[k].push(n);renderResults()}));
    }
    attachResultEvents();
  }catch(e){app.innerHTML=`<div class="card"><div class="status err">${esc(e.message)}</div><div class="hint" style="margin-top:8px">관리자 링크가 잘못되었거나 DB 설정이 완료되지 않았을 수 있습니다.</div></div>`}
}
function downloadCsv(data,assignments){const s=data.schedule,slots=getSlots(s);const rows=[['시간',...Array.from({length:s.day_count},(_,d)=>koDate(s.start_date,d))]];slots.forEach((m,i)=>{const r=[`${minToTime(m)}~${minToTime(Math.min(m+s.interval_minutes,timeToMin(s.end_time)))}`];for(let d=0;d<s.day_count;d++)r.push((assignments[slotKey(d,i)]||[]).join(' / '));rows.push(r)});const csv='\ufeff'+rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${s.title}_배치표.csv`;a.click();URL.revokeObjectURL(a.href)}

const q=new URLSearchParams(location.search);const admin=q.get('admin'),adminToken=q.get('token'),slug=q.get('s');
if(admin&&adminToken) renderAdmin(admin,adminToken); else if(slug) renderParticipant(slug); else renderHome();
</script>
</body>
</html>
