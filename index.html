async function rpc(name, payload={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`},
    body:JSON.stringify(payload)
  });
  const text = await res.text();
  if(!res.ok){ let msg=text; try{msg=JSON.parse(text).message||text}catch{}; throw new Error(msg); }
  return text ? JSON.parse(text) : null;
}
function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function token(){const a=new Uint8Array(24);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}
function ymd(d){return d.toISOString().slice(0,10)}
function addDays(str,n){const d=new Date(str+'T00:00:00');d.setDate(d.getDate()+n);return d}
function koDate(str,n){return new Intl.DateTimeFormat('ko-KR',{month:'numeric',day:'numeric',weekday:'short'}).format(addDays(str,n))}
function timeToMin(t){const [h,m]=t.split(':').map(Number);return h*60+m}
function minToTime(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function getSlots(s){const out=[];for(let m=timeToMin(s.start_time);m<timeToMin(s.end_time);m+=s.interval_minutes) out.push(m);return out}
function slotKey(d,i){return `${d}:${i}`}
function setStatus(id,msg,type='info'){const el=document.getElementById(id); if(!el)return; el.className=`status ${type}`;el.textContent=msg;el.classList.remove('hidden')}

async function createSchedule(){
  try{
    const p={
      p_title:document.getElementById('title').value.trim(),
      p_start_date:document.getElementById('startDate').value,
      p_day_count:+document.getElementById('dayCount').value,
      p_start_time:document.getElementById('startTime').value,
      p_end_time:document.getElementById('endTime').value,
      p_interval_minutes:+document.getElementById('interval').value,
      p_default_required:+document.getElementById('required').value,
      p_max_hours:4,
      p_admin_token:token()
    };
    if(!p.p_title||!p.p_start_date) throw new Error('시간표 이름과 날짜를 입력해주세요.');
    const r=await rpc('create_schedule',p);

    const excluded=[...(window.__excludedSelected||[])];
    for(const k of excluded){
      const {d,i}=parseSlotKey(k);
      await rpc('set_requirement',{
        p_slug:r.slug,
        p_admin_token:p.p_admin_token,
        p_day_index:d,
        p_slot_index:i,
        p_required:0
      });
    }

    const adminUrl=`?admin=${encodeURIComponent(r.slug)}&token=${encodeURIComponent(p.p_admin_token)}`;
    history.replaceState({},'',adminUrl);
    await renderAdmin(r.slug,p.p_admin_token);
  }catch(e){setStatus('createStatus',e.message,'err')}
}

function buildAvailabilityGrid(s, selected, interactive=true){
  const slots=getSlots(s);
  let h='<div class="scroll"><table class="sched"><thead><tr><th class="timecol">시간</th>';
  for(let d=0;d<s.day_count;d++) h+=`<th>${esc(koDate(s.start_date,d))}</th>`;
  h+='</tr></thead><tbody>';
  slots.forEach((m,i)=>{h+=`<tr><td class="timecol">${minToTime(m)}<br><span class="mini">~${minToTime(Math.min(m+s.interval_minutes,timeToMin(s.end_time)))}</span></td>`;for(let d=0;d<s.day_count;d++){const k=slotKey(d,i);h+=`<td><div class="slot ${interactive?'selectable':''} ${selected.has(k)?'selected':''}" data-key="${k}"></div></td>`}h+='</tr>'});
  return h+'</tbody></table></div>';
}

function attachDrag(selected,onChange){
  let dragging=false;
  let mode=true;
  const cells=[...document.querySelectorAll('.slot.selectable')];

  function apply(cell){
    if(!cell)return;
    const key=cell.dataset.key;
    if(mode){
      selected.add(key);
      cell.classList.add('selected');
    }else{
      selected.delete(key);
      cell.classList.remove('selected');
    }
    onChange();
  }

  cells.forEach(cell=>{
    cell.addEventListener('pointerdown',e=>{
      e.preventDefault();
      dragging=true;
      mode=!selected.has(cell.dataset.key);
      apply(cell);
    });

    cell.addEventListener('pointerenter',()=>{
      if(dragging)apply(cell);
    });
  });

  window.addEventListener('pointerup',()=>dragging=false);
  window.addEventListener('pointercancel',()=>dragging=false);
}

function scheduleResultTable(data, assignments){
  const s=data.schedule, slots=getSlots(s), avail=data.availability||{}, reqMap={};(data.requirements||[]).forEach(r=>reqMap[slotKey(r.day_index,r.slot_index)]=r.required);
  let h='<div class="scroll"><table class="sched"><thead><tr><th class="timecol">시간</th>';for(let d=0;d<s.day_count;d++)h+=`<th>${esc(koDate(s.start_date,d))}</th>`;h+='</tr></thead><tbody>';
  slots.forEach((m,i)=>{h+=`<tr><td class="timecol">${minToTime(m)}<br><span class="mini">~${minToTime(Math.min(m+s.interval_minutes,timeToMin(s.end_time)))}</span></td>`;for(let d=0;d<s.day_count;d++){const k=slotKey(d,i),as=assignments[k]||[],required=reqMap[k]??s.default_required;const candidates=required===0?[]:Object.keys(avail).filter(n=>(avail[n]||[]).includes(k)&&!as.includes(n));h+=required===0
      ? `<td><div class="slot" data-result-key="${k}" style="background:#f3f4f6"><div class="mini" style="padding-top:10px">배치 제외</div></div></td>`
      : `<td><div class="slot" data-result-key="${k}"><div class="assigned">${as.map(n=>`<span class="pill click assignedName" data-key="${k}" data-name="${esc(n)}" title="클릭하면 배치에서 제외">${esc(n)} ×</span>`).join('')}</div>${as.length<required?`<div class="need">${required-as.length}명 부족</div>`:''}<div class="req">필요 ${required}명 · 배치 ${as.length}명</div>${candidates.length?`<div class="candidates">가능한 다른 사람<br>${candidates.map(n=>`<span class="cand candidateName" data-key="${k}" data-name="${esc(n)}">${esc(n)}</span>`).join(' · ')}</div>`:'<div class="candidates">다른 가능 인원 없음</div>'}</div></td>`}h+='</tr>'});
  return h+'</tbody></table></div>';
}
function parseSlotKey(k){
  const [d,i]=k.split(':').map(Number);
  return {d,i};
}
function isAssigned(assignments,name,d,i){
  return (assignments[slotKey(d,i)]||[]).includes(name);
}
function consecutiveRunIfAdded(assignments,name,d,i,slotCount){
  let run=1;
  for(let x=i-1;x>=0;x--){
    if(isAssigned(assignments,name,d,x))run++;
    else break;
  }
  for(let x=i+1;x<slotCount;x++){
    if(isAssigned(assignments,name,d,x))run++;
    else break;
  }
  return run;
}
function autoAssign(data,options={}){
  const s=data.schedule;
  const avail=data.availability||{};
  const people=Object.keys(avail);
  const slots=getSlots(s);
  const slotCount=slots.length;
  const reqMap={};
  (data.requirements||[]).forEach(r=>reqMap[slotKey(r.day_index,r.slot_index)]=r.required);

  const a={};
  const counts={};
  people.forEach(p=>counts[p]=0);

  const maxTotalSlots=s.max_hours===0
    ? Infinity
    : Math.floor((s.max_hours*60)/s.interval_minutes);

  const maxConsecutiveHours=Number(options.maxConsecutiveHours||0);
  const maxConsecutiveSlots=maxConsecutiveHours===0
    ? Infinity
    : Math.floor((maxConsecutiveHours*60)/s.interval_minutes);

  const preferConsecutive=options.preferConsecutive!==false;

  for(let d=0;d<s.day_count;d++){
    for(let i=0;i<slotCount;i++){
      const k=slotKey(d,i);
      const need=reqMap[k]??s.default_required;
      a[k]=[];

      const cand=people
        .filter(name=>{
          if(!(avail[name]||[]).includes(k))return false;
          if(counts[name]>=maxTotalSlots)return false;
          if(maxConsecutiveSlots!==Infinity){
            const run=consecutiveRunIfAdded(a,name,d,i,slotCount);
            if(run>maxConsecutiveSlots)return false;
          }
          return true;
        })
        .map(name=>{
          let score=0;

          if(preferConsecutive){
            if(i>0 && isAssigned(a,name,d,i-1))score+=100;
            if(i+1<slotCount && (avail[name]||[]).includes(slotKey(d,i+1)))score+=12;
          }

          score-=counts[name]*8;
          score-=((avail[name]||[]).length)*0.05;

          return {name,score};
        })
        .sort((x,y)=>y.score-x.score || counts[x.name]-counts[y.name] || x.name.localeCompare(y.name,'ko'));

      for(const c of cand){
        if(a[k].length>=need)break;
        a[k].push(c.name);
        counts[c.name]++;
      }
    }
  }

  return a;
}
function personHours(assignments,name,s){let c=0;Object.values(assignments).forEach(a=>{if(a.includes(name))c++});return c*s.interval_minutes/60}

async function renderAdmin(slug,adminToken){
  app.innerHTML='<div class="card">관리자 화면을 불러오는 중...</div>';
  try{
    let data=await rpc('get_admin_schedule',{p_slug:slug,p_admin_token:adminToken});
    let assignments=data.assignments||{};
    const s=data.schedule;
    let editingName='';
    let editorSelected=new Set();

    app.innerHTML=`
      <div class="card">
        <h2 class="section-title">${esc(s.title)} <span class="mini">관리자</span></h2>
        <div class="hint">이 화면에서 사람을 한 명씩 추가하고, 각 사람의 가능시간을 직접 드래그해서 입력하세요.</div>
        <div class="hint" style="margin-top:6px">⚠️ 현재 주소는 관리자 전용입니다. 다른 사람에게 공유하지 마세요.</div>
      </div>

      <div class="stat">
        <div><span class="mini">입력 인원</span><b id="pCount">${data.participants.length}</b></div>
        <div><span class="mini">시간 단위</span><b>${s.interval_minutes}분</b></div>
        <div><span class="mini">1인 최대</span><b id="maxLabel">${s.max_hours===0?'제한 없음':s.max_hours===0.5?'30분':s.max_hours+'시간'}</b></div>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="row">
          <div class="grow">
            <h2 class="section-title" style="margin-bottom:4px">사람별 가능시간 입력</h2>
            <div class="hint">이름을 입력하고 시간표를 드래그한 뒤 저장하세요. 아래 사람 이름을 누르면 다시 수정할 수 있습니다.</div>
          </div>
          <button class="btn secondary" id="newPersonBtn">+ 새 사람</button>
        </div>

        <div class="grid" style="margin-top:14px">
          <div>
            <label>이름</label>
            <input id="adminPersonName" class="field" placeholder="예: 김민진" maxlength="60">
          </div>
          <div style="display:flex;align-items:end;gap:8px">
            <button class="btn primary" id="savePersonBtn">가능시간 저장</button>
            <button class="btn ghost" id="clearPersonBtn">선택 초기화</button>
          </div>
        </div>

        <div class="row" style="margin-top:12px">
          <span class="hint" id="adminCountTxt">0칸 선택</span>
        </div>
        <div id="adminAvailGrid" style="margin-top:12px">${buildAvailabilityGrid(s,editorSelected,true)}</div>
        <div id="personStatus" class="status hidden"></div>
      </div>

      <div class="card">
        <h2 class="section-title">입력한 사람</h2>
        <div id="peopleList" class="people"></div>
      </div>

      <div class="card">
        <div class="row">
          <div class="grow">
            <h2 class="section-title" style="margin-bottom:4px">자동배치 조건</h2>
            <div class="hint">가능시간·1인 최대시간·연속 최대시간을 지키면서, 가능하면 같은 사람의 시간이 이어지도록 우선 배치합니다.</div>
          </div>
          <div style="min-width:150px">
            <label style="margin-bottom:4px">1인 최대 배치</label>
            <select id="adminMax" class="field">
              <option value="0.5">30분</option>
              <option value="1">1시간</option>
              <option value="2">2시간</option>
              <option value="3">3시간</option>
              <option value="4">4시간</option>
              <option value="5">5시간</option>
              <option value="6">6시간</option>
              <option value="7">7시간</option>
              <option value="8">8시간</option>
              <option value="0">제한 없음</option>
            </select>
          </div>
          <div style="min-width:170px">
            <label style="margin-bottom:4px">연속 최대 배치</label>
          <select id="maxConsecutive" class="field">
            <option value="0.5">30분</option>
            <option value="1">1시간</option>
            <option value="2" selected>2시간</option>
            <option value="3">3시간</option>
            <option value="4">4시간</option>
            <option value="5">5시간</option>
            <option value="6">6시간</option>
            <option value="7">7시간</option>
            <option value="8">8시간</option>
            <option value="0">제한 없음</option>
          </select>
          </div>
          <label style="display:flex;align-items:center;gap:7px;margin:22px 0 0;white-space:nowrap">
            <input type="checkbox" id="preferConsecutive" checked>
            가능하면 연속 배치 우선
          </label>
          <button class="btn secondary" id="saveMax" style="margin-top:18px">조건 저장</button>
          <button class="btn primary" id="autoBtn" style="margin-top:18px">자동배치</button>
        </div>
        <div id="aStatus" class="status hidden"></div>
      </div>

      <div class="card">
        <div class="row">
          <div class="grow">
            <h2 class="section-title" style="margin-bottom:4px">최종 배치표</h2>
            <div class="hint">검은 이름 = 실제 배치 · 아래 작은 이름 = 그 시간에 가능한 다른 사람. 후보자를 클릭하면 추가, 배치자를 클릭하면 제외됩니다.</div>
          </div>
          <button class="btn ghost" id="csvBtn">CSV 다운로드</button>
          <button class="btn primary" id="saveAssign">배치표 저장</button>
        </div>
        <div id="resultWrap" style="margin-top:14px">${scheduleResultTable(data,assignments)}</div>
      </div>`;

    document.getElementById('adminMax').value=String(s.max_hours);
    const autoPrefKey=`timetable-maker:auto-prefs:${slug}`;
    let savedAutoPrefs={};
    try{savedAutoPrefs=JSON.parse(localStorage.getItem(autoPrefKey)||'{}')}catch{}
    document.getElementById('maxConsecutive').value=String(savedAutoPrefs.maxConsecutiveHours ?? 2);
    document.getElementById('preferConsecutive').checked=savedAutoPrefs.preferConsecutive ?? true;

    function editTokenKey(name){ return `timetable-maker:admin:${slug}:${name}`; }

    function ensureEditToken(name){
      let et=localStorage.getItem(editTokenKey(name));
      if(!et){ et=token(); localStorage.setItem(editTokenKey(name),et); }
      return et;
    }

    function redrawEditor(){
      document.getElementById('adminAvailGrid').innerHTML=buildAvailabilityGrid(s,editorSelected,true);
      document.getElementById('adminCountTxt').textContent=`${editorSelected.size}칸 선택`;
      attachDrag(editorSelected,()=>{
        document.getElementById('adminCountTxt').textContent=`${editorSelected.size}칸 선택`;
      });
    }

    function renderPeople(){
      const box=document.getElementById('peopleList');
      const names=Object.keys(data.availability||{});
      document.getElementById('pCount').textContent=names.length;
      if(!names.length){
        box.innerHTML='<span class="hint">아직 입력한 사람이 없습니다. 위에서 첫 사람을 추가해보세요.</span>';
        return;
      }
      box.innerHTML=names.map(name=>`<button class="person" data-person="${esc(name)}" style="cursor:pointer">${esc(name)} · 수정</button>`).join('');
      box.querySelectorAll('[data-person]').forEach(btn=>btn.addEventListener('click',()=>{
        const name=btn.dataset.person;
        editingName=name;
        document.getElementById('adminPersonName').value=name;
        editorSelected=new Set(data.availability[name]||[]);
        redrawEditor();
        setStatus('personStatus',`${name}님의 가능시간을 불러왔습니다. 수정 후 다시 저장하세요.`,'info');
        document.getElementById('adminPersonName').scrollIntoView({behavior:'smooth',block:'center'});
      }));
    }

    document.getElementById('newPersonBtn').addEventListener('click',()=>{
      editingName='';
      document.getElementById('adminPersonName').value='';
      editorSelected=new Set();
      redrawEditor();
      setStatus('personStatus','새 사람의 이름과 가능시간을 입력하세요.','info');
      document.getElementById('adminPersonName').focus();
    });

    document.getElementById('clearPersonBtn').addEventListener('click',()=>{
      editorSelected.clear();
      redrawEditor();
    });

    document.getElementById('savePersonBtn').addEventListener('click',async()=>{
      const name=document.getElementById('adminPersonName').value.trim();
      if(!name) return setStatus('personStatus','이름을 입력해주세요.','err');

      // Renaming an existing participant is intentionally not done silently,
      // because the DB uses (schedule, name) as the participant identity.
      if(editingName && editingName!==name){
        return setStatus('personStatus','기존 사람을 수정할 때는 이름을 바꾸지 말아주세요. 새 이름은 “+ 새 사람”으로 추가해주세요.','err');
      }

      try{
        const et=ensureEditToken(name);
        await rpc('submit_availability',{
          p_slug:slug,
          p_name:name,
          p_edit_token:et,
          p_slots:[...editorSelected]
        });

        data.availability=data.availability||{};
        data.availability[name]=[...editorSelected];

        if(!data.participants.some(p=>p.name===name)){
          data.participants.push({name});
        }

        editingName=name;
        renderPeople();
        renderResults();
        setStatus('personStatus',`${name}님의 가능시간을 저장했습니다.`,'ok');
      }catch(e){
        if(String(e.message).includes('같은 이름의 응답')){
          setStatus('personStatus',`이미 같은 이름의 데이터가 있는데 이 브라우저에 수정 권한이 없습니다. 새 이름으로 추가하거나 기존 참여자 데이터를 사용해주세요.`,'err');
        }else{
          setStatus('personStatus',e.message,'err');
        }
      }
    });

    document.getElementById('saveMax').addEventListener('click',async()=>{
      try{
        const v=+document.getElementById('adminMax').value;
        const maxConsecutiveHours=+document.getElementById('maxConsecutive').value;
        const preferConsecutive=document.getElementById('preferConsecutive').checked;

        await rpc('update_schedule_settings',{p_slug:slug,p_admin_token:adminToken,p_max_hours:v});
        data.schedule.max_hours=v;

        localStorage.setItem(autoPrefKey,JSON.stringify({
          maxConsecutiveHours,
          preferConsecutive
        }));

        document.getElementById('maxLabel').textContent=v===0?'제한 없음':v===0.5?'30분':v+'시간';
        setStatus('aStatus','자동배치 조건을 저장했습니다.','ok');
      }catch(e){setStatus('aStatus',e.message,'err')}
    });

    document.getElementById('autoBtn').addEventListener('click',()=>{
      data.schedule.max_hours=+document.getElementById('adminMax').value;
      const maxConsecutiveHours=+document.getElementById('maxConsecutive').value;
      const preferConsecutive=document.getElementById('preferConsecutive').checked;

      localStorage.setItem(autoPrefKey,JSON.stringify({
        maxConsecutiveHours,
        preferConsecutive
      }));

      assignments=autoAssign(data,{
        maxConsecutiveHours,
        preferConsecutive
      });
      renderResults();
      setStatus('aStatus','자동배치가 완료되었습니다. 연속시간 조건까지 반영했습니다.','ok');
    });

    document.getElementById('saveAssign').addEventListener('click',async()=>{
      try{
        await rpc('save_assignments',{p_slug:slug,p_admin_token:adminToken,p_assignments:assignments});
        setStatus('aStatus','배치표를 저장했습니다.','ok');
      }catch(e){setStatus('aStatus',e.message,'err')}
    });

    document.getElementById('csvBtn').addEventListener('click',()=>downloadCsv(data,assignments));

    function renderResults(){
      document.getElementById('resultWrap').innerHTML=scheduleResultTable(data,assignments);
      attachResultEvents();
    }

    function attachResultEvents(){
      document.querySelectorAll('.assignedName').forEach(el=>el.addEventListener('click',()=>{
        const k=el.dataset.key,n=el.dataset.name;
        assignments[k]=(assignments[k]||[]).filter(x=>x!==n);
        renderResults();
      }));
      document.querySelectorAll('.candidateName').forEach(el=>el.addEventListener('click',()=>{
        const k=el.dataset.key;
        const n=el.dataset.name;
        const max=+document.getElementById('adminMax').value;
        const h=personHours(assignments,n,data.schedule);
        const maxConsecutiveHours=+document.getElementById('maxConsecutive').value;

        if(max!==0&&h+data.schedule.interval_minutes/60>max){
          setStatus('aStatus',`${n}님은 1인 최대 배치시간(${max===0.5?'30분':max+'시간'})을 초과해서 추가할 수 없습니다.`,'err');
          return;
        }

        const {d,i}=parseSlotKey(k);
        const maxConsecutiveSlots=maxConsecutiveHours===0
          ? Infinity
          : Math.floor((maxConsecutiveHours*60)/data.schedule.interval_minutes);

        if(maxConsecutiveSlots!==Infinity){
          const run=consecutiveRunIfAdded(assignments,n,d,i,getSlots(data.schedule).length);
          if(run>maxConsecutiveSlots){
            setStatus('aStatus',`${n}님은 연속 최대 배치시간(${maxConsecutiveHours===0.5?'30분':maxConsecutiveHours+'시간'})을 초과해서 추가할 수 없습니다.`,'err');
            return;
          }
        }

        assignments[k]=assignments[k]||[];
        if(!assignments[k].includes(n))assignments[k].push(n);
        renderResults();
      }));
    }

    redrawEditor();
    renderPeople();
    attachResultEvents();

  }catch(e){
    app.innerHTML=`<div class="card"><div class="status err">${esc(e.message)}</div><div class="hint" style="margin-top:8px">관리자 링크가 잘못되었거나 DB 설정이 완료되지 않았을 수 있습니다.</div></div>`;
  }
}
function downloadCsv(data,assignments){const s=data.schedule,slots=getSlots(s);const rows=[['시간',...Array.from({length:s.day_count},(_,d)=>koDate(s.start_date,d))]];slots.forEach((m,i)=>{const r=[`${minToTime(m)}~${minToTime(Math.min(m+s.interval_minutes,timeToMin(s.end_time)))}`];for(let d=0;d<s.day_count;d++)r.push((assignments[slotKey(d,i)]||[]).join(' / '));rows.push(r)});const csv='\ufeff'+rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${s.title}_배치표.csv`;a.click();URL.revokeObjectURL(a.href)}

const q=new URLSearchParams(location.search);const admin=q.get('admin'),adminToken=q.get('token'),slug=q.get('s');
if(admin&&adminToken) renderAdmin(admin,adminToken); else if(slug) renderParticipant(slug); else renderHome();
</script>
</body>
